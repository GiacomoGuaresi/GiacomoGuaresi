name: Update GitHub stats cards

on:
  schedule:
    # Every day at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/stats-generator.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          # Optional: set a personal access token as the STATS_TOKEN secret to
          # include private contributions. Falls back to the built-in token,
          # which only sees public activity.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/stats-generator.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain img/stats)" ]; then
            echo "Cards unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/stats
          git commit -m "chore: refresh GitHub stats cards"
          git push
