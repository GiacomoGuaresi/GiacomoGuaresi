name: Deploy site to GitHub Pages

# Publishes only what the site serves. Deploying the branch as it is also put
# tools/ (source photographs, TTF fonts, scripts) and the CV sources online.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir -p _site/cv
          cp index.html _site/
          cp -r css js fonts img _site/
          cp cv/*.pdf _site/cv/
          # GitHub Pages runs Jekyll on anything without this marker.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
